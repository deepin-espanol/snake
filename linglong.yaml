version: "1"

package:
  id: org.deepinenespanol.snake
  name: "Snake"
  version: 0.2.0.0
  kind: app
  description: |
    Classic Snake game for Deepin desktop

command:
  - /opt/apps/org.deepinenespanol.snake/files/bin/snake

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

# Se empaqueta el .deb ya compilado (el CI lo deja en debs/).
# Se lee de /project/debs/ porque ll-builder vacia linglong/sources.
build: |
  dpkg-deb -X /project/debs/snake_*.deb $PREFIX/
  mv $PREFIX/usr/bin $PREFIX/bin
  mv $PREFIX/usr/share $PREFIX/share
  rm -rf $PREFIX/usr
  sed -i 's#^Exec=.*#Exec=/opt/apps/org.deepinenespanol.snake/files/bin/snake#' \
      $PREFIX/share/applications/org.deepinenespanol.snake.desktop

sources: []
